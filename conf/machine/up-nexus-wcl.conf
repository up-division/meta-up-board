#@TYPE: Machine
#@NAME: up-nexus-wcl

#@DESCRIPTION: Machine configuration for AAEON UP Nexus WCL (Intel Core Series 3,
#@ formerly Wildcat Lake) systems

PREFERRED_PROVIDER_virtual/kernel ?= "linux-intel"
PREFERRED_VERSION_linux-intel ?= "6.18%"

require conf/machine/include/up-common.inc

# Onboard storage is UFS (up to 256GB), not eMMC/SATA - see ufs.cfg in the
# linux-intel_6.18.bbappend for the kernel config needed to detect it.

# TODO: verify against real hardware - ACPI table names below are inherited
# from up-xtreme-i14 as a starting point and have not been confirmed against
# an actual UP Nexus WCL board.
ACPI_TABLES ?= "pc00.spi0.spidev1.0.asl"
INITRD_LIVE:prepend = "${DEPLOY_DIR_IMAGE}/acpi-tables.cpio "
EXTRA_IMAGEDEPENDS:append = " acpi-tables"

# npu-firmware
IMAGE_INSTALL:append = " npu-firmware"

# linux-firmware (pulled in via MACHINE_EXTRA_RRECOMMENDS in up-common.inc)
# recommends linux-firmware-intel-vpu, which ships the same
# intel/vpu/vpu_37xx_v0.0.bin file as our own npu-firmware package above,
# causing an opkg file clash. Our npu-firmware already provides it.
BAD_RECOMMENDATIONS:append = " linux-firmware-intel-vpu linux-firmware-intel-vpu-license"
